<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASINO TABLE CONTROL</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #080808;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
}

button {
    font-family: inherit;
}

.hidden {
    display: none !important;
}

/* =========================
   START SCREEN
========================= */

#startScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

.start-container {
    width: min(900px, 100%);
    text-align: center;
}

.logo {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: 8px;
    margin-bottom: 10px;
}

.logo-sub {
    color: #888;
    letter-spacing: 4px;
    margin-bottom: 50px;
}

.role-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

.role-button {
    min-height: 220px;
    border: 1px solid #333;
    background: #111;
    color: white;
    border-radius: 18px;
    cursor: pointer;
    transition: 0.2s;
}

.role-button:hover {
    background: #181818;
    border-color: #777;
}

.role-button:active {
    transform: scale(0.98);
}

.role-title {
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 15px;
}

.role-description {
    color: #888;
    font-size: 15px;
}

/* =========================
   MAIN
========================= */

#mainScreen {
    min-height: 100vh;
}

.header {
    height: 80px;
    border-bottom: 1px solid #292929;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    background: #0b0b0b;
    position: sticky;
    top: 0;
    z-index: 10;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 20px;
}

.header-title {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
}

.header-role {
    color: #888;
    font-size: 13px;
}

.back-button {
    background: #181818;
    border: 1px solid #333;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
}

.content {
    padding: 30px;
    max-width: 1400px;
    margin: auto;
}

/* =========================
   RECEPTION
========================= */

.dashboard-summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 30px;
}

.summary-card {
    background: #111;
    border: 1px solid #292929;
    border-radius: 12px;
    padding: 20px;
}

.summary-label {
    color: #777;
    font-size: 13px;
    margin-bottom: 10px;
}

.summary-number {
    font-size: 34px;
    font-weight: bold;
}

.table-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.table-card {
    min-height: 220px;
    border-radius: 16px;
    border: 2px solid #333;
    background: #111;
    padding: 25px;
    cursor: pointer;
    position: relative;
    transition: 0.2s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.table-card:hover {
    background: #161616;
}

.table-card:active {
    transform: scale(0.98);
}

.table-card.available {
    border-color: #18a558;
}

.table-card.occupied {
    border-color: #c92b2b;
}

.table-type {
    color: #888;
    font-size: 13px;
    letter-spacing: 1px;
}

.table-name {
    font-size: 27px;
    font-weight: bold;
    margin-top: 8px;
}

.status-area {
    display: flex;
    justify-content: space-between;
    align-items: end;
}

.status {
    font-size: 18px;
    font-weight: bold;
}

.available .status {
    color: #25c76a;
}

.occupied .status {
    color: #e33b3b;
}

.timer {
    font-family: monospace;
    font-size: 22px;
    color: #ddd;
}

.table-id {
    position: absolute;
    right: 20px;
    top: 20px;
    color: #555;
    font-size: 12px;
}

/* =========================
   DEALER
========================= */

.dealer-panel {
    max-width: 800px;
    margin: auto;
}

.my-table {
    background: #111;
    border: 2px solid #333;
    border-radius: 18px;
    padding: 30px;
    margin-bottom: 25px;
}

.my-table.available {
    border-color: #18a558;
}

.my-table.occupied {
    border-color: #c92b2b;
}

.my-table-title {
    font-size: 14px;
    color: #777;
}

.my-table-name {
    font-size: 38px;
    font-weight: bold;
    margin: 10px 0 30px;
}

.large-status {
    text-align: center;
    padding: 25px;
    border-radius: 12px;
    background: #080808;
    margin-bottom: 20px;
}

.large-status-text {
    font-size: 28px;
    font-weight: bold;
}

.large-timer {
    font-family: monospace;
    font-size: 52px;
    margin-top: 10px;
}

.dealer-control-button {
    width: 100%;
    padding: 20px;
    border-radius: 12px;
    border: none;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

.start-button {
    background: #159447;
    color: white;
}

.stop-button {
    background: #b52222;
    color: white;
}

.check-button {
    width: 100%;
    margin-top: 15px;
    padding: 17px;
    background: #181818;
    border: 1px solid #444;
    border-radius: 12px;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

/* =========================
   OTHER TABLES
========================= */

.other-tables {
    margin-top: 35px;
}

.section-title {
    font-size: 18px;
    margin-bottom: 15px;
    color: #aaa;
}

.mini-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.mini-card {
    background: #111;
    border: 1px solid #292929;
    border-left: 5px solid #555;
    border-radius: 10px;
    padding: 17px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.mini-card.available {
    border-left-color: #18a558;
}

.mini-card.occupied {
    border-left-color: #c92b2b;
}

.mini-name {
    font-weight: bold;
}

.mini-status {
    font-size: 13px;
}

.mini-card.available .mini-status {
    color: #25c76a;
}

.mini-card.occupied .mini-status {
    color: #e33b3b;
}

/* =========================
   MODAL
========================= */

.modal-background {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal {
    width: min(500px, 100%);
    background: #111;
    border: 1px solid #444;
    border-radius: 18px;
    padding: 30px;
}

.modal-title {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 5px;
}

.modal-subtitle {
    color: #777;
    margin-bottom: 30px;
}

.modal-button {
    width: 100%;
    padding: 18px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.modal-available {
    background: #159447;
}

.modal-occupied {
    background: #b52222;
}

.modal-cancel {
    background: #222;
    border: 1px solid #444;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 800px) {

    .role-grid {
        grid-template-columns: 1fr;
    }

    .role-button {
        min-height: 150px;
    }

    .table-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .dashboard-summary {
        grid-template-columns: repeat(3, 1fr);
    }

    .content {
        padding: 20px;
    }
}

@media (max-width: 550px) {

    .header {
        height: 70px;
        padding: 0 15px;
    }

    .header-title {
        font-size: 17px;
    }

    .content {
        padding: 15px;
    }

    .table-grid {
        grid-template-columns: 1fr;
    }

    .dashboard-summary {
        gap: 8px;
    }

    .summary-card {
        padding: 12px;
    }

    .summary-number {
        font-size: 25px;
    }

    .table-card {
        min-height: 190px;
    }

    .my-table-name {
        font-size: 30px;
    }

    .large-timer {
        font-size: 40px;
    }

    .mini-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<!-- =========================
     START SCREEN
========================= -->

<div id="startScreen">

    <div class="start-container">

        <div class="logo">CASINO</div>
        <div class="logo-sub">TABLE CONTROL SYSTEM</div>

        <div class="role-grid">

            <button class="role-button" onclick="selectReception()">
                <div class="role-title">受付</div>
                <div class="role-description">
                    全テーブルの使用状況を管理
                </div>
            </button>

            <button class="role-button" onclick="showDealerSelection()">
                <div class="role-title">ディーラー</div>
                <div class="role-description">
                    担当テーブルの状態を管理
                </div>
            </button>

        </div>

    </div>

</div>


<!-- =========================
     MAIN SCREEN
========================= -->

<div id="mainScreen" class="hidden">

    <header class="header">

        <div class="header-left">

            <div class="header-title">
                CASINO CONTROL
            </div>

            <div id="headerRole" class="header-role">
                受付
            </div>

        </div>

        <button class="back-button" onclick="backToStart()">
            戻る
        </button>

    </header>


    <!-- =========================
         RECEPTION SCREEN
    ========================= -->

    <main id="receptionScreen" class="content hidden">

        <div class="dashboard-summary">

            <div class="summary-card">
                <div class="summary-label">
                    TOTAL TABLES
                </div>
                <div id="totalTables" class="summary-number">
                    7
                </div>
            </div>

            <div class="summary-card">
                <div class="summary-label">
                    AVAILABLE
                </div>
                <div id="availableTables" class="summary-number">
                    7
                </div>
            </div>

            <div class="summary-card">
                <div class="summary-label">
                    IN USE
                </div>
                <div id="occupiedTables" class="summary-number">
                    0
                </div>
            </div>

        </div>


        <div id="receptionTableGrid" class="table-grid">
        </div>

    </main>


    <!-- =========================
         DEALER SCREEN
    ========================= -->

    <main id="dealerScreen" class="content hidden">

        <div class="dealer-panel">

            <div id="myTableContainer" class="my-table">

                <div class="my-table-title">
                    MY TABLE
                </div>

                <div id="myTableName" class="my-table-name">
                    -
                </div>

                <div class="large-status">

                    <div id="myTableStatus"
                         class="large-status-text">
                        -
                    </div>

                    <div id="myTableTimer"
                         class="large-timer">
                        00:00:00
                    </div>

                </div>

                <button id="dealerControlButton"
                        class="dealer-control-button"
                        onclick="toggleMyTable()">
                    使用開始
                </button>

                <button class="check-button"
                        onclick="toggleOtherTables()">
                    使用状況確認
                </button>

            </div>


            <div id="otherTablesArea"
                 class="other-tables hidden">

                <div class="section-title">
                    OTHER TABLES
                </div>

                <div id="dealerOtherTables"
                     class="mini-grid">
                </div>

            </div>

        </div>

    </main>

</div>


<!-- =========================
     MODAL
========================= -->

<div id="statusModal"
     class="modal-background hidden">

    <div class="modal">

        <div id="modalTitle"
             class="modal-title">
            テーブル
        </div>

        <div class="modal-subtitle">
            使用状況を変更してください
        </div>

        <button class="modal-button modal-available"
                onclick="setSelectedTableStatus(false)">
            空きにする
        </button>

        <button class="modal-button modal-occupied"
                onclick="setSelectedTableStatus(true)">
            使用中にする
        </button>

        <button class="modal-button modal-cancel"
                onclick="closeModal()">
            キャンセル
        </button>

    </div>

</div>


<script>

/* =========================================================
   TABLE DATA
   Firebase接続時には、この部分をFirestore等と接続する
========================================================= */

const tables = {

    bjp1: {
        id: "bjp1",
        name: "BLACKJACK / POKER 1",
        type: "BLACKJACK / POKER",
        occupied: false,
        startedAt: null
    },

    bjp2: {
        id: "bjp2",
        name: "BLACKJACK / POKER 2",
        type: "BLACKJACK / POKER",
        occupied: false,
        startedAt: null
    },

    bjp3: {
        id: "bjp3",
        name: "BLACKJACK / POKER 3",
        type: "BLACKJACK / POKER",
        occupied: false,
        startedAt: null
    },

    roulette1: {
        id: "roulette1",
        name: "ROULETTE 1",
        type: "ROULETTE",
        occupied: false,
        startedAt: null
    },

    roulette2: {
        id: "roulette2",
        name: "ROULETTE 2",
        type: "ROULETTE",
        occupied: false,
        startedAt: null
    },

    darts1: {
        id: "darts1",
        name: "DARTS 1",
        type: "DARTS",
        occupied: false,
        startedAt: null
    },

    darts2: {
        id: "darts2",
        name: "DARTS 2",
        type: "DARTS",
        occupied: false,
        startedAt: null
    }

};


/* =========================================================
   現在のユーザー
========================================================= */

let currentRole = null;
let currentDealerTable = null;
let selectedTable = null;


/* =========================================================
   START SCREEN
========================================================= */

function selectReception() {

    currentRole = "reception";

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("mainScreen")
        .classList.remove("hidden");

    document.getElementById("receptionScreen")
        .classList.remove("hidden");

    document.getElementById("dealerScreen")
        .classList.add("hidden");

    document.getElementById("headerRole")
        .textContent = "受付";

    renderReception();

}


function showDealerSelection() {

    const dealer = prompt(
        "担当台を入力してください\n\n" +
        "1：ブラックジャック・ポーカー 1\n" +
        "2：ブラックジャック・ポーカー 2\n" +
        "3：ブラックジャック・ポーカー 3\n" +
        "4：ルーレット 1\n" +
        "5：ルーレット 2\n" +
        "6：ダーツ 1\n" +
        "7：ダーツ 2"
    );

    const dealerMap = {

        "1": "bjp1",
        "2": "bjp2",
        "3": "bjp3",
        "4": "roulette1",
        "5": "roulette2",
        "6": "darts1",
        "7": "darts2"

    };

    if (!dealerMap[dealer]) {
        return;
    }

    selectDealer(dealerMap[dealer]);

}


function selectDealer(tableId) {

    currentRole = "dealer";
    currentDealerTable = tableId;

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("mainScreen")
        .classList.remove("hidden");

    document.getElementById("receptionScreen")
        .classList.add("hidden");

    document.getElementById("dealerScreen")
        .classList.remove("hidden");

    document.getElementById("headerRole")
        .textContent = "ディーラー";

    renderDealer();

}


/* =========================================================
   BACK
========================================================= */

function backToStart() {

    currentRole = null;
    currentDealerTable = null;

    document.getElementById("mainScreen")
        .classList.add("hidden");

    document.getElementById("startScreen")
        .classList.remove("hidden");

}


/* =========================================================
   RECEPTION RENDER
========================================================= */

function renderReception() {

    const grid =
        document.getElementById("receptionTableGrid");

    grid.innerHTML = "";

    Object.values(tables).forEach(table => {

        const card = document.createElement("div");

        card.className =
            "table-card " +
            (table.occupied ? "occupied" : "available");

        card.onclick = () => openTableModal(table.id);

        const elapsed =
            table.occupied && table.startedAt
                ? formatElapsed(Date.now() - table.startedAt)
                : "00:00:00";

        card.innerHTML = `

            <div>

                <div class="table-id">
                    ${table.id}
                </div>

                <div class="table-type">
                    ${table.type}
                </div>

                <div class="table-name">
                    ${table.name}
                </div>

            </div>

            <div class="status-area">

                <div class="status">
                    ${table.occupied ? "使用中" : "空き"}
                </div>

                <div class="timer">
                    ${elapsed}
                </div>

            </div>

        `;

        grid.appendChild(card);

    });

    updateSummary();

}


/* =========================================================
   SUMMARY
========================================================= */

function updateSummary() {

    const allTables =
        Object.values(tables);

    const occupied =
        allTables.filter(table => table.occupied).length;

    const available =
        allTables.length - occupied;

    document.getElementById("totalTables")
        .textContent = allTables.length;

    document.getElementById("availableTables")
        .textContent = available;

    document.getElementById("occupiedTables")
        .textContent = occupied;

}


/* =========================================================
   DEALER RENDER
========================================================= */

function renderDealer() {

    const table =
        tables[currentDealerTable];

    if (!table) return;

    document.getElementById("myTableName")
        .textContent = table.name;

    const container =
        document.getElementById("myTableContainer");

    container.classList.remove("available");
    container.classList.remove("occupied");

    container.classList.add(
        table.occupied ? "occupied" : "available"
    );

    document.getElementById("myTableStatus")
        .textContent =
        table.occupied ? "使用中" : "空き";

    document.getElementById("myTableTimer")
        .textContent =
        table.occupied && table.startedAt
            ? formatElapsed(Date.now() - table.startedAt)
            : "00:00:00";

    const button =
        document.getElementById("dealerControlButton");

    if (table.occupied) {

        button.textContent = "使用終了";
        button.className =
            "dealer-control-button stop-button";

    } else {

        button.textContent = "使用開始";
        button.className =
            "dealer-control-button start-button";

    }

    renderOtherTables();

}


/* =========================================================
   OTHER TABLES
========================================================= */

function toggleOtherTables() {

    const area =
        document.getElementById("otherTablesArea");

    area.classList.toggle("hidden");

}


function renderOtherTables() {

    const container =
        document.getElementById("dealerOtherTables");

    container.innerHTML = "";

    Object.values(tables)
        .filter(table => table.id !== currentDealerTable)
        .forEach(table => {

            const div = document.createElement("div");

            div.className =
                "mini-card " +
                (table.occupied ? "occupied" : "available");

            const elapsed =
                table.occupied && table.startedAt
                    ? formatElapsed(Date.now() - table.startedAt)
                    : "";

            div.innerHTML = `

                <div>
                    <div class="mini-name">
                        ${table.name}
                    </div>
                </div>

                <div class="mini-status">
                    ${table.occupied
                        ? "使用中 " + elapsed
                        : "空き"}
                </div>

            `;

            container.appendChild(div);

        });

}


/* =========================================================
   DEALER TABLE CONTROL
========================================================= */

function toggleMyTable() {

    const table =
        tables[currentDealerTable];

    if (!table) return;

    if (table.occupied) {

        table.occupied = false;
        table.startedAt = null;

    } else {

        table.occupied = true;
        table.startedAt = Date.now();

    }

    /*
       Firebase接続時：

       updateTableToFirebase(table);

       のような処理をここに入れる。
    */

    renderDealer();

}


/* =========================================================
   RECEPTION TABLE EDIT
========================================================= */

function openTableModal(tableId) {

    selectedTable = tableId;

    const table =
        tables[tableId];

    document.getElementById("modalTitle")
        .textContent = table.name;

    document.getElementById("statusModal")
        .classList.remove("hidden");

}


function closeModal() {

    selectedTable = null;

    document.getElementById("statusModal")
        .classList.add("hidden");

}


function setSelectedTableStatus(occupied) {

    if (!selectedTable) return;

    const table =
        tables[selectedTable];

    table.occupied = occupied;

    if (occupied) {

        /*
           すでに使用中なら
           タイマーをリセットしない
        */

        if (!table.startedAt) {
            table.startedAt = Date.now();
        }

    } else {

        table.startedAt = null;

    }

    /*
       Firebase接続時：

       updateTableToFirebase(table);

       のような処理をここに入れる。
    */

    closeModal();

    renderReception();

}


/* =========================================================
   TIMER
========================================================= */

function formatElapsed(milliseconds) {

    if (!milliseconds || milliseconds < 0) {
        return "00:00:00";
    }

    const totalSeconds =
        Math.floor(milliseconds / 1000);

    const hours =
        Math.floor(totalSeconds / 3600);

    const minutes =
        Math.floor((totalSeconds % 3600) / 60);

    const seconds =
        totalSeconds % 60;

    return [

        String(hours).padStart(2, "0"),
        String(minutes).padStart(2, "0"),
        String(seconds).padStart(2, "0")

    ].join(":");

}


/* =========================================================
   TIMER REFRESH
========================================================= */

setInterval(() => {

    if (currentRole === "reception") {

        renderReception();

    }

    if (currentRole === "dealer") {

        renderDealer();

    }

}, 1000);


/* =========================================================
   FIREBASE IMPLEMENTATION PLACEHOLDER
========================================================= */

/*

   後でFirebaseを追加するときは、ここに

   1. Firebase初期化
   2. Firestore接続
   3. テーブルデータ取得
   4. onSnapshotによるリアルタイム監視
   5. テーブル状態のupdate

   を追加する。

   想定データ：

   tables/{tableId}

   {
       name: "ROULETTE 1",
       type: "ROULETTE",
       occupied: true,
       startedAt: Firebase Timestamp
   }

*/


</script>

</body>
</html>
