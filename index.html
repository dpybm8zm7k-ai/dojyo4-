<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>CASINO TABLE CONTROL</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #080808;
    color: #ffffff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
}

button {
    font-family: inherit;
}

.hidden {
    display: none !important;
}


/* =====================================================
   START SCREEN
===================================================== */

#startScreen {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

.start-container {
    width: min(950px, 100%);
    text-align: center;
}

.logo {
    font-size: clamp(38px, 7vw, 64px);
    font-weight: 800;
    letter-spacing: 10px;
}

.logo-sub {
    margin-top: 8px;
    color: #777;
    font-size: 13px;
    letter-spacing: 4px;
}

.firebase-status {
    margin-top: 18px;
    color: #666;
    font-size: 12px;
}

.firebase-status.connected {
    color: #25c76a;
}

.firebase-status.error {
    color: #e33b3b;
}

.role-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
    margin-top: 55px;
}

.role-button {
    min-height: 230px;
    background: #111;
    border: 1px solid #303030;
    border-radius: 18px;
    color: white;
    cursor: pointer;
    transition:
        background 0.2s,
        border-color 0.2s,
        transform 0.1s;
}

.role-button:hover {
    background: #181818;
    border-color: #666;
}

.role-button:active {
    transform: scale(0.98);
}

.role-title {
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 14px;
}

.role-description {
    color: #888;
    font-size: 14px;
}


/* =====================================================
   DEALER SELECT
===================================================== */

#dealerSelectScreen {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.dealer-select-container {
    width: min(1000px, 100%);
}

.dealer-select-title {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 35px;
}

.dealer-select-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.dealer-select-button {
    min-height: 130px;
    background: #111;
    border: 1px solid #333;
    border-radius: 14px;
    color: white;
    cursor: pointer;
    transition: 0.15s;
}

.dealer-select-button:hover {
    background: #181818;
    border-color: #666;
}

.dealer-select-button:active {
    transform: scale(0.98);
}

.dealer-select-number {
    color: #666;
    font-size: 12px;
    margin-bottom: 8px;
}

.dealer-select-name {
    font-size: 20px;
    font-weight: bold;
}

.dealer-back-button {
    display: block;
    width: 200px;
    margin: 25px auto 0;
    padding: 14px;
    background: #181818;
    border: 1px solid #444;
    border-radius: 10px;
    color: white;
    cursor: pointer;
}


/* =====================================================
   MAIN
===================================================== */

#mainScreen {
    min-height: 100vh;
    min-height: 100dvh;
}

.header {
    position: sticky;
    top: 0;
    z-index: 50;
    height: 78px;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(10, 10, 10, 0.96);
    border-bottom: 1px solid #292929;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 18px;
}

.header-title {
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 2px;
}

.header-role {
    color: #777;
    font-size: 13px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.back-button {
    background: #181818;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    color: white;
    padding: 10px 17px;
    cursor: pointer;
}


/* =====================================================
   MP3 BUTTON IN HEADER
===================================================== */

.header-sound-button {
    background: #181818;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    color: white;
    padding: 10px 12px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
}

.header-sound-button:hover {
    background: #222;
}

.header-sound-file {
    max-width: 120px;
    color: #777;
    font-size: 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}


/* =====================================================
   CONTENT
===================================================== */

.content {
    width: min(1400px, 100%);
    margin: 0 auto;
    padding: 30px;
}


/* =====================================================
   RECEPTION SUMMARY
===================================================== */

.dashboard-summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 28px;
}

.summary-card {
    background: #111;
    border: 1px solid #292929;
    border-radius: 12px;
    padding: 20px;
}

.summary-label {
    color: #707070;
    font-size: 12px;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.summary-number {
    font-size: 35px;
    font-weight: bold;
}


/* =====================================================
   RECEPTION TABLE GRID
===================================================== */

.table-grid {

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    grid-template-rows:
        repeat(3, minmax(0, 1fr));

    gap: 20px;

    /*
       左列
       BLACKJACK / POKER 1
       BLACKJACK / POKER 2
       BLACKJACK / POKER 3

       中央列
       ROULETTE 1
       ROULETTE 2

       右列
       DARTS 1
       DARTS 2

       3段目の空き部分は空白。
       ルーレット2・ダーツ2が
       2段分に伸びないようにしている。
    */

    grid-template-areas:

        "bjp1 roulette1 darts1"

        "bjp2 roulette2 darts2"

        "bjp3 . .";

}


/* =====================================================
   TABLE POSITIONS
===================================================== */

.table-card[data-table-id="bjp1"] {
    grid-area: bjp1;
}

.table-card[data-table-id="bjp2"] {
    grid-area: bjp2;
}

.table-card[data-table-id="bjp3"] {
    grid-area: bjp3;
}

.table-card[data-table-id="roulette1"] {
    grid-area: roulette1;
}

.table-card[data-table-id="roulette2"] {
    grid-area: roulette2;
}

.table-card[data-table-id="darts1"] {
    grid-area: darts1;
}

.table-card[data-table-id="darts2"] {
    grid-area: darts2;
}


/* =====================================================
   TABLE CARD
===================================================== */

.table-card {

    min-height: 220px;

    background: #111;

    border: 2px solid #333;

    border-radius: 16px;

    padding: 24px;

    position: relative;

    cursor: pointer;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    transition:
        background 0.15s,
        transform 0.1s;

}

.table-card:hover {
    background: #171717;
}

.table-card:active {
    transform: scale(0.985);
}

.table-card.available {
    border-color: #159447;
}

.table-card.occupied {
    border-color: #c92b2b;
}

.table-id {
    position: absolute;
    top: 18px;
    right: 20px;
    color: #444;
    font-size: 11px;
}

.table-type {
    color: #777;
    font-size: 12px;
    letter-spacing: 1px;
}

.table-name {
    font-size: 25px;
    font-weight: bold;
    margin-top: 8px;
    padding-right: 35px;
}

.status-area {
    display: flex;
    align-items: end;
    justify-content: space-between;
    margin-top: 30px;
}

.status {
    font-size: 18px;
    font-weight: bold;
}

.available .status {
    color: #25c76a;
}

.occupied .status {
    color: #e33b3b;
}

.timer {
    color: #ddd;
    font-family: monospace;
    font-size: 20px;
}


/* =====================================================
   DEALER PANEL
===================================================== */

.dealer-panel {
    width: min(850px, 100%);
    margin: 0 auto;
}

.my-table {
    background: #111;
    border: 2px solid #333;
    border-radius: 18px;
    padding: 30px;
}

.my-table.available {
    border-color: #159447;
}

.my-table.occupied {
    border-color: #c92b2b;
}

.my-table-title {
    color: #777;
    font-size: 12px;
    letter-spacing: 1px;
}

.my-table-name {
    font-size: 37px;
    font-weight: bold;
    margin-top: 8px;
    margin-bottom: 30px;
}

.large-status {
    background: #080808;
    border-radius: 13px;
    padding: 25px;
    text-align: center;
    margin-bottom: 20px;
}

.large-status-text {
    font-size: 27px;
    font-weight: bold;
}

.my-table.available .large-status-text {
    color: #25c76a;
}

.my-table.occupied .large-status-text {
    color: #e33b3b;
}

.large-timer {
    margin-top: 9px;
    color: #ddd;
    font-family: monospace;
    font-size: 52px;
}

.dealer-control-button {
    width: 100%;
    padding: 20px;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

.start-button {
    background: #159447;
}

.start-button:hover {
    background: #1ba952;
}

.stop-button {
    background: #b52222;
}

.stop-button:hover {
    background: #cc2929;
}

.check-button {
    width: 100%;
    margin-top: 15px;
    padding: 17px;
    background: #181818;
    border: 1px solid #444;
    border-radius: 12px;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

.check-button:hover {
    background: #222;
}


/* =====================================================
   OTHER TABLES
===================================================== */

.other-tables {
    margin-top: 35px;
}

.section-title {
    color: #aaa;
    font-size: 16px;
    letter-spacing: 1px;
    margin-bottom: 15px;
}

.mini-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.mini-card {
    background: #111;
    border: 1px solid #292929;
    border-left: 5px solid #555;
    border-radius: 10px;
    padding: 17px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.mini-card.available {
    border-left-color: #159447;
}

.mini-card.occupied {
    border-left-color: #c92b2b;
}

.mini-name {
    font-weight: bold;
}

.mini-type {
    color: #666;
    font-size: 11px;
    margin-top: 4px;
}

.mini-status {
    font-family: monospace;
    font-size: 13px;
    white-space: nowrap;
}

.mini-card.available .mini-status {
    color: #25c76a;
}

.mini-card.occupied .mini-status {
    color: #e33b3b;
}


/* =====================================================
   MODAL
===================================================== */

.modal-background {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.78);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.modal {
    width: min(500px, 100%);
    background: #111;
    border: 1px solid #444;
    border-radius: 18px;
    padding: 30px;
}

.modal-title {
    font-size: 25px;
    font-weight: bold;
}

.modal-subtitle {
    color: #777;
    margin-top: 6px;
    margin-bottom: 25px;
}

.modal-button {
    width: 100%;
    padding: 18px;
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.modal-available {
    background: #159447;
}

.modal-occupied {
    background: #b52222;
}

.modal-cancel {
    background: #222;
    border: 1px solid #444;
}


/* =====================================================
   LOADING
===================================================== */

.loading {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: #080808;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
}

.loading-text {
    color: #aaa;
    font-size: 14px;
}


/* =====================================================
   RECEPTION GREEN ALERT
===================================================== */

#receptionAlert {

    position: fixed;

    inset: 0;

    z-index: 999;

    pointer-events: none;

    border: 0 solid #00ff66;

    box-shadow: none;

}


#receptionAlert.active {

    /*
       フェードなし。
       きっぱり点灯・消灯。

       0.5秒 × 9回
       約4.5秒
    */

    animation:
        receptionAlertAnimation
        0.5s
        steps(1, end)
        9;

}


@keyframes receptionAlertAnimation {

    0% {

        border-width: 0;

        box-shadow: none;

    }

    50% {

        border-width: 14px;

        box-shadow:
            inset 0 0 0 14px #00ff66;

    }

    100% {

        border-width: 0;

        box-shadow: none;

    }

}


/* =====================================================
   STATUS ANIMATION
===================================================== */

@keyframes occupiedPulse {

    0% {

        box-shadow:
            0 0 0 0
            rgba(201, 43, 43, 0);

    }

    50% {

        box-shadow:
            0 0 25px 0
            rgba(201, 43, 43, 0.12);

    }

    100% {

        box-shadow:
            0 0 0 0
            rgba(201, 43, 43, 0);

    }

}


.table-card.occupied {

    animation:
        occupiedPulse
        2s
        infinite;

}


/* =====================================================
   IPAD RECEPTION FIT
===================================================== */

@media
    (min-width: 601px)
    and (max-width: 1200px)
{

    /*
       受付画面だけをiPadの縦画面内に収める。

       ヘッダーやカードの基本的なデザインは変更せず、
       受付画面の余白とカードの高さだけを
       利用可能な画面高に合わせる。
    */

    #receptionScreen {

        height:
            calc(100dvh - 78px);

        overflow: hidden;

        padding-top: 18px;

        padding-bottom: 18px;

    }


    #receptionScreen .dashboard-summary {

        margin-bottom: 14px;

    }


    #receptionScreen .summary-card {

        padding: 12px 16px;

    }


    #receptionScreen .summary-label {

        margin-bottom: 4px;

    }


    #receptionScreen .summary-number {

        font-size: 29px;

    }


    #receptionScreen .table-grid {

        height:
            calc(
                100% -
                112px
            );

        grid-template-rows:
            repeat(3, minmax(0, 1fr));

        gap: 12px;

    }


    #receptionScreen .table-card {

        min-height: 0;

        padding: 18px;

    }


    #receptionScreen .status-area {

        margin-top: 10px;

    }

}


/* =====================================================
   IPAD LANDSCAPE
===================================================== */

@media
    (min-width: 601px)
    and (max-height: 800px)
{

    #receptionScreen {

        padding-top: 12px;

        padding-bottom: 12px;

    }


    #receptionScreen .dashboard-summary {

        margin-bottom: 10px;

    }


    #receptionScreen .summary-card {

        padding: 8px 14px;

    }


    #receptionScreen .summary-number {

        font-size: 25px;

    }


    #receptionScreen .table-grid {

        height:
            calc(
                100% -
                96px
            );

        gap: 10px;

    }


    #receptionScreen .table-card {

        padding: 15px;

    }


    #receptionScreen .table-name {

        font-size: 21px;

    }

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 850px) {

    .dealer-select-grid {

        grid-template-columns:
            repeat(2, 1fr);

    }

}


@media (max-width: 600px) {

    .header {

        height: 68px;

        padding: 0 15px;

    }

    .header-title {
        font-size: 16px;
    }

    .header-role {
        font-size: 11px;
    }

    .content {
        padding: 15px;
    }

    .dashboard-summary {
        gap: 8px;
    }

    .summary-card {
        padding: 13px;
    }

    .summary-number {
        font-size: 25px;
    }


    /*
       スマートフォンでも
       3列構成を維持。
    */

    .table-grid {

        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        grid-template-rows:
            repeat(3, auto);

        grid-template-areas:

            "bjp1 roulette1 darts1"

            "bjp2 roulette2 darts2"

            "bjp3 . .";

        gap: 8px;

    }

    .table-card {

        min-height: 190px;

        padding: 12px;

    }

    .table-name {
        font-size: 17px;
    }

    .table-type {
        font-size: 9px;
    }

    .table-id {

        top: 10px;
        right: 10px;
        font-size: 8px;

    }

    .status {
        font-size: 13px;
    }

    .timer {
        font-size: 11px;
    }

    .large-timer {
        font-size: 39px;
    }

    .my-table {
        padding: 20px;
    }

    .my-table-name {
        font-size: 29px;
    }

    .mini-grid {
        grid-template-columns: 1fr;
    }


    /*
       MP3ボタンはヘッダーにあるため、
       受付画面内のサウンドコントロールは表示しない。
    */

    .header-right {

        gap: 5px;

    }


    .header-sound-button {

        padding:
            8px 9px;

        font-size: 10px;

    }


    .header-sound-file {

        display: none;

    }

}


@media (max-width: 430px) {

    .role-grid {

        grid-template-columns: 1fr;

        margin-top: 40px;

    }

    .role-button {
        min-height: 160px;
    }

    .dealer-select-grid {
        grid-template-columns: 1fr;
    }

}


/* =====================================================
   SOUND FILE NAME
===================================================== */

#soundFileName {

    max-width: 150px;

}


/* =====================================================
   HIDE FILE INPUT
===================================================== */

#soundFileInput {

    display: none;

}

</style>
</head>


<body>


<!-- =====================================================
     RECEPTION ALERT
===================================================== -->

<div id="receptionAlert"></div>


<!-- =====================================================
     AUDIO
===================================================== -->

<audio
    id="availableSound"
    preload="auto">
</audio>


<!-- =====================================================
     LOADING SCREEN
===================================================== -->

<div
    id="loadingScreen"
    class="loading">

    <div class="loading-text">
        Firebaseに接続しています...
    </div>

</div>


<!-- =====================================================
     START SCREEN
===================================================== -->

<div
    id="startScreen"
    class="hidden">

    <div class="start-container">

        <div class="logo">
            CASINO
        </div>

        <div class="logo-sub">
            TABLE CONTROL SYSTEM
        </div>

        <div
            id="firebaseStatus"
            class="firebase-status">

            Firebase接続中...

        </div>


        <div class="role-grid">

            <button
                class="role-button"
                onclick="selectReception()">

                <div class="role-title">
                    受付
                </div>

                <div class="role-description">
                    全テーブルの使用状況を管理
                </div>

            </button>


            <button
                class="role-button"
                onclick="showDealerSelection()">

                <div class="role-title">
                    ディーラー
                </div>

                <div class="role-description">
                    担当テーブルの使用状況を管理
                </div>

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     DEALER SELECT SCREEN
===================================================== -->

<div
    id="dealerSelectScreen"
    class="hidden">

    <div class="dealer-select-container">

        <div class="dealer-select-title">
            担当テーブルを選択
        </div>


        <div
            id="dealerSelectGrid"
            class="dealer-select-grid">
        </div>


        <button
            class="dealer-back-button"
            onclick="backToStart()">

            戻る

        </button>

    </div>

</div>


<!-- =====================================================
     MAIN SCREEN
===================================================== -->

<div
    id="mainScreen"
    class="hidden">


    <header class="header">

        <div class="header-left">

            <div class="header-title">
                CASINO CONTROL
            </div>

            <div
                id="headerRole"
                class="header-role">

                受付

            </div>

        </div>


        <div class="header-right">


            <!-- =========================================
                 MP3 SELECT
            ========================================== -->

            <label
                id="headerSoundButton"
                class="header-sound-button">

                MP3選択

                <input
                    id="soundFileInput"
                    type="file"
                    accept=".mp3,audio/mpeg">

            </label>


            <div
                id="headerSoundFile"
                class="header-sound-file">

                未選択

            </div>


            <button
                id="headerSoundTest"
                class="header-sound-button"
                onclick="testAvailableSound()">

                音テスト

            </button>


            <button
                class="back-button"
                onclick="backToStart()">

                戻る

            </button>

        </div>

    </header>


    <!-- =================================================
         RECEPTION
    ================================================== -->

    <main
        id="receptionScreen"
        class="content hidden">


        <div class="dashboard-summary">


            <div class="summary-card">

                <div class="summary-label">
                    TOTAL TABLES
                </div>

                <div
                    id="totalTables"
                    class="summary-number">

                    7

                </div>

            </div>


            <div class="summary-card">

                <div class="summary-label">
                    AVAILABLE
                </div>

                <div
                    id="availableTables"
                    class="summary-number">

                    7

                </div>

/*
   受付端末で選択したMP3。

   MP3そのものはFirebaseには送信しない。
   選択した端末のブラウザ内だけで使用する。
*/

let selectedSoundUrl = null;


/* =====================================================
   FIREBASE INITIALIZED
===================================================== */

window.firebaseInitialized = function() {

    const status =
        document.getElementById(
            "firebaseStatus"
        );


    if (status) {

        status.textContent =
            "● FIREBASE CONNECTED";

        status.classList.add(
            "connected"
        );

    }


    startFirebaseListener();

};


/* =====================================================
   FIREBASE ERROR
===================================================== */

window.firebaseInitializationError =
function(error) {

    console.error(error);


    const status =
        document.getElementById(
            "firebaseStatus"
        );


    if (status) {

        status.textContent =
            "● FIREBASE CONNECTION ERROR";

        status.classList.add(
            "error"
        );

    }


    hideLoading();

};


/* =====================================================
   HIDE LOADING
===================================================== */

function hideLoading() {

    document
        .getElementById(
            "loadingScreen"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "startScreen"
        )
        .classList.remove(
            "hidden"
        );

}


/* =====================================================
   FIREBASE LISTENER
===================================================== */

function startFirebaseListener() {

    if (firebaseListenerStarted) {
        return;
    }


    firebaseListenerStarted = true;


    const tablesRef =
        window.casinoTablesRef;


    window.firebaseOnValue(

        tablesRef,

        snapshot => {

            const data =
                snapshot.val();


            if (!data) {

                const initialData = {};


                Object.values(
                    defaultTables
                ).forEach(table => {

                    initialData[
                        table.id
                    ] = {

                        id: table.id,

                        name: table.name,

                        type: table.type,

                        occupied: false,

                        startedAt: null

                    };

                });


                window.firebaseSet(
                    tablesRef,
                    initialData
                );


                return;

            }


            tables = data;


            Object.values(
                defaultTables
            ).forEach(defaultTable => {

                if (
                    !tables[
                        defaultTable.id
                    ]
                ) {

                    tables[
                        defaultTable.id
                    ] = {
                        ...defaultTable
                    };

                }

            });


            /*
               使用中 → 空き
               の変化を検知。
            */

            if (!firstFirebaseLoad) {

                Object.values(
                    tables
                ).forEach(table => {

                    const previous =
                        previousTableStates[
                            table.id
                        ];


                    if (
                        previous === true &&
                        table.occupied === false
                    ) {

                        if (
                            currentRole ===
                            "reception"
                        ) {

                            playAvailableAlert();

                        }

                    }

                });

            }


            Object.values(
                tables
            ).forEach(table => {

                previousTableStates[
                    table.id
                ] =
                    Boolean(
                        table.occupied
                    );

            });


            firstFirebaseLoad = false;


            refreshCurrentScreen();

        },

        error => {

            console.error(
                "Realtime Database error:",
                error
            );

        }

    );

}


/* =====================================================
   MP3 FILE SELECT
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const input =
            document.getElementById(
                "soundFileInput"
            );


        if (!input) {
            return;
        }


        input.addEventListener(
            "change",
            event => {

                const file =
                    event.target.files[0];


                if (!file) {
                    return;
                }


                if (
                    file.type !==
                    "audio/mpeg" &&
                    !file.name
                        .toLowerCase()
                        .endsWith(".mp3")
                ) {

                    alert(
                        "MP3ファイルを選択してください。"
                    );


                    input.value = "";

                    return;

                }


                if (
                    selectedSoundUrl
                ) {

                    URL.revokeObjectURL(
                        selectedSoundUrl
                    );

                }


                selectedSoundUrl =
                    URL.createObjectURL(
                        file
                    );


                const audio =
                    document.getElementById(
                        "availableSound"
                    );


                audio.src =
                    selectedSoundUrl;


                audio.load();


                const fileName =
                    document.getElementById(
                        "headerSoundFile"
                    );


                fileName.textContent =
                    file.name;

            }
        );

    }
);


/* =====================================================
   TEST SOUND
===================================================== */

function testAvailableSound() {

    const audio =
        document.getElementById(
            "availableSound"
        );


    if (
        !audio ||
        !audio.src
    ) {

        alert(
            "先にMP3ファイルを選択してください。"
        );

        return;

    }


    audio.currentTime = 0;


    const promise =
        audio.play();


    if (
        promise !==
        undefined
    ) {

        promise.catch(
            error => {

                console.warn(
                    "Audio playback failed:",
                    error
                );

                alert(
                    "音声を再生できませんでした。"
                );

            }
        );

    }

}


/* =====================================================
   AVAILABLE ALERT
===================================================== */

function playAvailableAlert() {

    const audio =
        document.getElementById(
            "availableSound"
        );


    if (
        audio &&
        audio.src
    ) {

        audio.currentTime = 0;


        const playPromise =
            audio.play();


        if (
            playPromise !==
            undefined
        ) {

            playPromise.catch(
                error => {

                    console.warn(
                        "MP3 playback was blocked:",
                        error
                    );

                }
            );

        }

    }


    /*
       フェードなし。
       きっぱり点灯・消灯。
       太めの緑色。
    */

    const alertElement =
        document.getElementById(
            "receptionAlert"
        );


    if (!alertElement) {
        return;
    }


    alertElement.classList.remove(
        "active"
    );


    void alertElement.offsetWidth;


    alertElement.classList.add(
        "active"
    );


    setTimeout(
        () => {

            alertElement.classList.remove(
                "active"
            );

        },
        5000
    );

}

    */

/* =====================================================
   DEALER TABLE CONTROL
===================================================== */

async function toggleMyTable() {

    if (!currentDealerTable) {
        return;
    }


    const table =
        tables[
            currentDealerTable
        ];


    if (!table) {
        return;
    }


    if (
        !window.firebaseReady ||
        !window.firebaseDatabase
    ) {

        alert(
            "Firebaseに接続されていません。"
        );

        return;

    }


    const tableRef =
        window.firebaseRef(
            window.firebaseDatabase,
            "casinoTables/" +
            currentDealerTable
        );


    try {

        if (table.occupied) {

            await window.firebaseUpdate(
                tableRef,
                {
                    occupied: false,
                    startedAt: null
                }
            );

        } else {

            await window.firebaseUpdate(
                tableRef,
                {
                    occupied: true,
                    startedAt:
                        window.firebaseServerTimestamp()
                }
            );

        }

    } catch (error) {

        console.error(
            "Table update error:",
            error
        );


        alert(
            "テーブル状態の更新に失敗しました。"
        );

    }

}


/* =====================================================
   RECEPTION MODAL
===================================================== */

function openTableModal(tableId) {

    selectedTable =
        tableId;


    const table =
        tables[
            tableId
        ];


    if (!table) {
        return;
    }


    document.getElementById(
        "modalTitle"
    ).textContent =
        table.name;


    document
        .getElementById(
            "statusModal"
        )
        .classList.remove(
            "hidden"
        );

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal() {

    selectedTable =
        null;


    document
        .getElementById(
            "statusModal"
        )
        .classList.add(
            "hidden"
        );

}


/* =====================================================
   RECEPTION CHANGE STATUS
===================================================== */

async function setSelectedTableStatus(
    occupied
) {

    if (!selectedTable) {
        return;
    }


    const table =
        tables[
            selectedTable
        ];


    if (!table) {
        return;
    }


    if (
        !window.firebaseReady ||
        !window.firebaseDatabase
    ) {

        alert(
            "Firebaseに接続されていません。"
        );

        return;

    }


    const tableRef =
        window.firebaseRef(
            window.firebaseDatabase,
            "casinoTables/" +
            selectedTable
        );


    try {

        if (occupied) {

            if (table.occupied) {

                closeModal();

                return;

            }


            await window.firebaseUpdate(
                tableRef,
                {
                    occupied: true,
                    startedAt:
                        window.firebaseServerTimestamp()
                }
            );

        } else {

            await window.firebaseUpdate(
                tableRef,
                {
                    occupied: false,
                    startedAt: null
                }
            );

        }


        closeModal();

    } catch (error) {

        console.error(
            "Reception update error:",
            error
        );


        alert(
            "テーブル状態の更新に失敗しました。"
        );

    }

}


/* =====================================================
   TIMER FORMAT
===================================================== */

function formatElapsed(
    milliseconds
) {

    if (
        !milliseconds ||
        milliseconds < 0
    ) {

        return "00:00:00";

    }


    const totalSeconds =
        Math.floor(
            milliseconds / 1000
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    return [

        String(hours).padStart(
            2,
            "0"
        ),

        String(minutes).padStart(
            2,
            "0"
        ),

        String(seconds).padStart(
            2,
            "0"
        )

    ].join(":");

}


/* =====================================================
   TIMER REFRESH
===================================================== */

setInterval(() => {

    if (
        currentRole ===
        "reception"
    ) {

        renderReception();

    }


    if (
        currentRole ===
        "dealer"
    ) {

        renderDealer();

    }

}, 1000);


/* =====================================================
   MODAL BACKGROUND CLICK
===================================================== */

document
    .getElementById(
        "statusModal"
    )
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "statusModal"
            ) {

                closeModal();

            }

        }
    );


/* =====================================================
   INITIALIZE
===================================================== */

window.addEventListener(
    "load",
    () => {

        let waitCount = 0;


        const waitTimer =
            setInterval(
                () => {

                    waitCount++;


                    if (
                        window.firebaseReady ===
                        true
                    ) {

                        clearInterval(
                            waitTimer
                        );

                        hideLoading();

                        return;

                    }


                    if (
                        window.firebaseReady ===
                        false
                    ) {

                        clearInterval(
                            waitTimer
                        );

                        hideLoading();

                        return;

                    }


                    if (
                        waitCount >= 100
                    ) {

                        clearInterval(
                            waitTimer
                        );

                        hideLoading();

                    }

                },
                100
            );

    }
);

</script>
